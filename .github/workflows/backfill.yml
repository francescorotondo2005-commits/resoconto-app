name: Manual Stats Backfill
on:
  workflow_dispatch:
    inputs:
      max_matches:
        description: 'Numero massimo di match da arricchire'
        required: true
        default: '50'
      league:
        description: 'Lega specifica (opzionale, es: ChampionsLeague)'
        required: false
        default: ''

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Node Dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Run Smart Backfill
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          SCRAPER_SERVICE_URL: ${{ secrets.SCRAPER_SERVICE_URL }}
        run: |
          LEAGUE_ARG=""
          if [ ! -z "${{ github.event.inputs.league }}" ]; then
            LEAGUE_ARG="--league ${{ github.event.inputs.league }}"
          fi
          node smart_backfill.js --max ${{ github.event.inputs.max_matches }} $LEAGUE_ARG
